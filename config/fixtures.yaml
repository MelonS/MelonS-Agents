# =============================================================================
# Fixture catalog — real, CC-licensed sample videos for end-to-end testing
# =============================================================================
# Why this exists:
#   The bootstrap script generates synthetic lectures via macOS `say` for unit
#   smoke. That validates the pipeline but tells us nothing about how the
#   editor behaves on real footage (real resolution, real bitrate, real
#   motion). This catalog lists permissively-licensed remote samples that the
#   agents may pull for integration tests and demo runs.
#
# Selection rules:
#   - Must be reachable without API credentials (no Pexels / Pixabay API key).
#   - Must have a stated permissive license (CC-BY, CC-0, or explicit "free
#     for any use" terms from the publisher).
#   - URL must be a direct file (yt-dlp / curl can fetch with no scraping).
#
# Note on Pexels:
#   Pexels' public sample URLs rotate per asset (videos.pexels.com/video-files
#   /<id>/...), and the canonical way to pull them programmatically is via
#   their Search API which requires a free key. We do NOT bake a Pexels key
#   into the repo. To add a Pexels asset, copy the direct .mp4 link from the
#   asset page on pexels.com and append below with `license: pexels-license`.
#
# All fixtures land under $FIXTURE_DIR (default /tmp/smoke/) after running:
#   ./scripts/fetch-fixtures.sh
# =============================================================================

fixtures:
  - id: bbb_320p
    name: Big Buck Bunny (full short, 320x180)
    url: https://download.blender.org/peach/bigbuckbunny_movies/BigBuckBunny_320x180.mp4
    source_attribution: "Big Buck Bunny © Blender Foundation — peach.blender.org"
    license: CC-BY-3.0
    license_url: https://creativecommons.org/licenses/by/3.0/
    expected:
      width: 320
      height: 180
      min_duration_s: 590
      has_audio: true
    mission_hint: highlight   # full ~10min short — long enough for the 60s window

  - id: sintel_trailer_1080p
    name: Sintel trailer (1080p)
    url: https://download.blender.org/durian/trailer/sintel_trailer-1080p.mp4
    source_attribution: "Sintel © Blender Foundation — durian.blender.org"
    license: CC-BY-3.0
    license_url: https://creativecommons.org/licenses/by/3.0/
    expected:
      width: 1920
      height: 1080
      min_duration_s: 50
      has_audio: true
    mission_hint: summarize   # 52s teaser — perfect for the summarize mission

  - id: sintel_trailer_720p
    name: Sintel trailer (720p)
    url: https://download.blender.org/durian/trailer/sintel_trailer-720p.mp4
    source_attribution: "Sintel © Blender Foundation — durian.blender.org"
    license: CC-BY-3.0
    license_url: https://creativecommons.org/licenses/by/3.0/
    expected:
      width: 1280
      height: 720
      min_duration_s: 50
      has_audio: true
    mission_hint: shorts-batch

# -----------------------------------------------------------------------------
# Synthetic fixtures (offline, generated by scripts/bootstrap.sh)
# Listed here so QA tooling can iterate them too.
# -----------------------------------------------------------------------------
synthetic:
  - id: synth_en_lecture
    path: /tmp/smoke/lecture.mp4
    source_attribution: "synthetic English lecture — macOS `say` voice Samantha"
    license: locally-generated
  - id: synth_ko_lecture
    path: /tmp/smoke/ko_lecture.mp4
    source_attribution: "synthetic Korean lecture — macOS `say` voice Yuna"
    license: locally-generated
