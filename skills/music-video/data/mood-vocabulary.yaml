# Mood vocabulary for music-video B-roll search expansion.
#
# Per docs/research/2026-05-22-music-video-pro-practices.md §7:
# each mood word resolves to 5-8 visual primitives.  Pexels searches
# rotate through the primitives across requests rather than searching
# the literal mood word once.  Effects:
#   (a) Raises B-roll diversity (the existing dedup registry forces
#       per-clip uniqueness; rotating primitives ensures each request
#       lands a different concept too)
#   (b) Anchors search in concrete visual concepts instead of
#       abstract feelings
#
# CONSUMED BY:
#   - scripts/pexels-fetch.sh (when MUSIC_VIDEO_MOOD env is set)
#   - scripts/shot-plan.sh (future: per-segment mood resolution)
#
# Each genre preset can opt-in by setting `mood: <key>` in
# skills/music-video/data/genre-presets.yaml.  Default behavior
# (no `mood:` field) is unchanged from current behavior.

moods:

  # ───── Atmospheric ─────

  nostalgic:
    primitives:
      - polaroid camera
      - warm window light
      - handwritten note paper
      - super 8 film grain
      - faded sunlight curtain
      - vintage diary close
      - old photo album
      - retro typewriter
    sources:
      - StudioBinder mood-board guide
      - Aesthetics Wiki (analog-era references)

  dreamy:
    primitives:
      - fog forest morning
      - soft focus pastel
      - golden hour beach silhouette
      - slow motion fabric breeze
      - water reflection ripple
      - lens flare warm
      - bokeh fairy lights
      - misty mountain horizon
    sources:
      - Pexels emotional footage / dreamy category

  cozy:
    primitives:
      - indoor desk lamp evening
      - rain streaks on window
      - hands holding coffee mug
      - knit blanket fold
      - candle flame close
      - book shelf warm light
      - wool sweater texture
      - kitchen tea steam
