# Genre presets for music-video skill.
#
# Each preset is a bundle of pipeline parameters that override the v6
# default treatment to match the target genre's visual contract (see
# docs/research/2026-05-21-music-shorts-formats-landscape.md "Shader /
# effect ↔ music-genre matching principles").
#
# CONSUMED BY:
#   - agents/missions/music-video/run.sh (when MUSIC_VIDEO_GENRE=<name>)
#   - scripts/music-video-shaders.sh (when --genre <name>)
#   - scripts/genre-detect.sh (mapping helper)
#
# PARAMETERS:
#   phrase_beats          int       cut every N beats (overrides MUSIC_VIDEO_PHRASE_BEATS)
#   grain_intensity       int       0=off; default 8
#   vignette_angle        string    ffmpeg vignette expression or "off"
#   zoom_pulse_amp        float     0=off; default 0.08
#   shader                string    post-shader: none|pond|breathing|halation|combo|
#                                   scanline|neon_edge|vhs|saturation_pulse|chromatic_split|
#                                   kaleidoscope|datamosh|stillzoom
#   lut_direction         string    descriptive — used by shader/operator decisions
#   cut_mode              string    cuts|stillzoom — stillzoom = no cuts, Ken Burns only
#   forbidden_effects     [string]  effects the operator should never apply to this genre
#   notes                 string    rationale for the operator
#
# DEFAULTS (when MUSIC_VIDEO_GENRE is unset): unchanged from v6 baseline —
# this file is purely additive, no behavior change without opt-in.

genres:

  # ───── Slow / sparse family (no cuts, no glitch) ─────

  ambient:
    aliases: [drone, minimal_ambient, dark_ambient]
    phrase_beats: 999          # effectively no cuts
    grain_intensity: 6
    vignette_angle: PI/4
    zoom_pulse_amp: 0          # ABSOLUTELY no zoom-pulse
    shader: halation           # warm bloom as primary effect
    lut_direction: cool_desat
    cut_mode: stillzoom
    forbidden_effects: [pond, scanline, neon_edge, datamosh, chromatic_split]
    keyword_pool:              # default Pexels queries when operator doesn't supply
      - soft window light
      - foggy mountain
      - candle flame slow
      - empty room sunset
      - rain on glass slow
      - drifting clouds
    phrase_pool:
      - soft window
      - the hours that pass
      - no one is awake
      - stillness
      - between dreams
    notes: |
      Ambient music expects perpetual stillness with slow color/zoom drifts.
      The drum-onset zoom-pulse and 12-beat cuts both violate the genre
      contract.  Use stillzoom mode (Ken-Burns on one image) + warm halation.

  drone:
    aliases: [doom_jazz, doom_ambient]
    phrase_beats: 999
    grain_intensity: 10        # heavier grain — adds movement to static frames
    vignette_angle: PI/3
    zoom_pulse_amp: 0
    shader: halation
    lut_direction: cool_desat_dark
    cut_mode: stillzoom
    forbidden_effects: [pond, scanline, neon_edge, datamosh]
    keyword_pool:
      - dark cloud time-lapse
      - mountain mist
      - subway tunnel slow
      - industrial smoke
      - abandoned highway
      - cathedral interior
    phrase_pool:
      - the long descent
      - no horizon
      - what remains
      - after the last train
      - hollow space
    notes: |
      Drone / doom jazz tolerates and benefits from heavier grain.  Vignette
      deeper.  Always low-key (underexposed look).

  shoegaze:
    aliases: [dream_pop, slowdive]
    phrase_beats: 16            # 4-beat soft cuts at most
    grain_intensity: 6
    vignette_angle: PI/5
    zoom_pulse_amp: 0
    shader: chromatic_split    # mild chromatic aberration (shoegaze code: visual distortion)
    lut_direction: desat_warm
    cut_mode: cuts
    forbidden_effects: [scanline, neon_edge, datamosh]
    keyword_pool:
      - blurred neon street
      - rain on lens
      - tape grain texture
      - soft sunset wash
      - fairy lights bokeh
      - wet pavement reflection
    phrase_pool:
      - you are not here
      - the room is loud
      - I think I saw you
      - summer ending
      - blurred
    notes: |
      Shoegaze visual code: "close-ups losing definition" + chromatic.
      Slight blur welcome.  Crisp clean grading reads as wrong genre.

  # ───── Lo-fi / chill family (8-beat cuts, halation, NO glitch) ─────

  lofi_hiphop:
    aliases: [chillhop, lofi, downtempo]
    phrase_beats: 16            # 8-beat soft cuts
    grain_intensity: 8
    vignette_angle: PI/5
    zoom_pulse_amp: 0          # **CRITICAL — lo-fi is anti-glitch**
    shader: halation
    lut_direction: warm_amber
    cut_mode: cuts
    forbidden_effects: [scanline, neon_edge, datamosh, chromatic_split]
    keyword_pool:
      - rainy window
      - vinyl record spinning
      - coffee shop interior
      - warm desk lamp
      - tokyo alley night
      - vintage turntable
    phrase_pool:
      - rainy window
      - 3 AM in seoul
      - the last train
      - warm rhodes
      - vinyl crackle
    notes: |
      Lo-fi production aesthetic is structurally anti-glitch.  Lofi Girl
      and Chillhop have years of consistent practice on this.  The drum-
      onset zoom-pulse is the primary "띠용" source flagged by the operator
      on the 5/20 batch.  Strongest single mapping in the catalog.

  jazz:
    aliases: [acoustic_jazz, smooth_jazz]
    phrase_beats: 12            # 4-8 beat soft cuts
    grain_intensity: 8
    vignette_angle: PI/4        # deeper, low-key noir
    zoom_pulse_amp: 0          # glitch FORBIDDEN
    shader: halation
    lut_direction: warm_low_key
    cut_mode: cuts
    forbidden_effects: [scanline, neon_edge, datamosh, kaleidoscope]
    keyword_pool:
      - smoky jazz bar
      - wet street lamp
      - rain on glass close
      - muted trumpet hand
      - cigarette smoke close
      - noir hat detective
    phrase_pool:
      - last call
      - wet street lamp
      - smoke and brass
      - the corner booth
      - a slow exit
    notes: |
      Warm halation + grain + low-key vignette = jazz-noir visual code.
      Add halation to current default; kill the zoom-pulse.

  # ───── City pop / vocal-centric (vocals are the foreground) ─────

  citypop:
    aliases: [city_pop, kr_citypop, jp_citypop, vocal_citypop, ballad]
    phrase_beats: 16            # 8-beat soft cuts, vocal-respecting
    grain_intensity: 6
    vignette_angle: PI/4        # deeper, warmer
    zoom_pulse_amp: 0          # FORBIDDEN — vocals carry the energy
    shader: halation           # warm bloom for nostalgia
    lut_direction: warm_amber_purple
    cut_mode: cuts
    forbidden_effects: [scanline, neon_edge, datamosh, kaleidoscope, chromatic_split]
    keyword_pool:
      - tokyo night neon street
      - shibuya crossing rain
      - city skyline 80s
      - subway window night
      - taxi headlights rain
      - elevated train tracks dusk
    phrase_pool:
      - the last train
      - rooftop nights
      - city as it sleeps
      - someone is waiting
      - across the river
    notes: |
      City pop / K-citypop / J-citypop are vocal-centric (vocals are the
      foreground, not the backdrop).  No zoom-pulse, no glitch, no neon
      — vocals carry all the energy and visual must NOT compete.  Warm
      halation + amber LUT + slow soft cuts.  Designed for both Korean
      city pop (vocal-citypop-kr-*) and Japanese city pop references.

  # ───── Hi-fi clean family (denser cuts, sharper) ─────

  house:
    aliases: [tropical_house, deep_house, future_house, disco_house, french_house, nu_disco, disco]
    phrase_beats: 8             # 2-beat cuts
    grain_intensity: 2          # MUCH less grain than lo-fi
    vignette_angle: PI/3        # softer
    zoom_pulse_amp: 0.06       # mild zoom-pulse OK on kick
    shader: color_burst        # was: saturation_pulse — color_burst lands disco drops
    # saturation_pulse / beat_burst also valid alternatives
    lut_direction: high_saturation
    cut_mode: cuts
    forbidden_effects: [vhs, datamosh, kaleidoscope]
    keyword_pool:
      - palm tree golden hour
      - ocean wave slow-mo
      - rooftop pool sunset
      - tropical leaves backlit
      - beach sunset silhouette
      - warm shoreline
    phrase_pool:
      - golden hour
      - endless summer
      - the ocean knows
      - barefoot at dawn
      - salt on skin
    notes: |
      House is hi-fi clean — heavy grain fights the production.  Saturation
      pulse on kick gives it the right energy.

  techno:
    aliases: [tech_house, minimal_techno]
    phrase_beats: 4             # 1-beat cuts (very dense)
    grain_intensity: 0
    vignette_angle: PI/2        # very subtle / nearly off
    zoom_pulse_amp: 0.12       # stronger pulse, kick-driven
    shader: strobe              # was: saturation_pulse — strobe is the techno code
    lut_direction: high_saturation
    cut_mode: cuts
    forbidden_effects: [vhs, halation]
    keyword_pool:
      - club strobe lights
      - warehouse silhouette
      - neon escalator descend
      - industrial corridor
      - subway platform empty
      - metal grate macro
    phrase_pool:
      - pulse
      - machine prayer
      - underground
      - hold the line
      - the kick is law
    notes: |
      Industrial / cold / metallic. No warmth, no grain. Edge glow welcome.

  # ───── Synthwave / retrowave family (scanlines, neon, NO grain/halation) ─────

  synthwave:
    aliases: [retrowave, outrun, vaporwave_neon]
    phrase_beats: 8             # 2-beat cuts
    grain_intensity: 0          # FORBIDDEN
    vignette_angle: off         # no vignette
    zoom_pulse_amp: 0.05       # slight, controlled
    shader: beat_burst         # was: scanline — beat_burst lands the drops
    # scanline / light_rays / neon_edge also valid alternatives for synthwave
    lut_direction: hot_pink_cyan
    cut_mode: cuts
    forbidden_effects: [halation, vhs, grain]
    keyword_pool:
      - neon sunset grid
      - retro arcade controls
      - tokyo neon street
      - vaporwave pastel
      - chrome reflection
      - palm tree pink sunset
    phrase_pool:
      - 1986 forever
      - neon sunset
      - highway to nowhere
      - the arcade glows
      - tokyo by night
    notes: |
      Synthwave visual code: neon grid + sunset gradient + scanlines.
      Soft grain reads as lo-fi (wrong genre).  Current 5/21 Arcade short
      has this mismatch.

  vaporwave:
    aliases: [vaporwave_aesthetic, mallsoft]
    phrase_beats: 999           # very slow / loopy
    grain_intensity: 4
    vignette_angle: PI/4
    zoom_pulse_amp: 0
    shader: vhs
    lut_direction: pastel_purple_pink_teal
    cut_mode: stillzoom         # vaporwave is more about looping aesthetic than cuts
    forbidden_effects: [scanline, datamosh, saturation_pulse]
    keyword_pool:
      - mall fountain low-fi
      - roman bust pastel
      - windows 95 chrome
      - pastel sky vhs
      - mannequin store
      - empty atrium
    phrase_pool:
      - empty mall
      - pastel forever
      - the gym is closed
      - elevator music
      - windows 95
    notes: |
      Vaporwave: VHS + chromatic + pastel.  Sharp hi-contrast reads as wrong.

  # ───── Fast / chaotic family (datamosh, frame stutter) ─────

  phonk:
    aliases: [drift_phonk, anime_edit]
    phrase_beats: 4
    grain_intensity: 4
    vignette_angle: PI/6
    zoom_pulse_amp: 0.15
    shader: shake               # was: chromatic_split — shake = drift energy
    # chromatic_split / beat_burst also valid alternatives for phonk
    lut_direction: high_contrast_warm
    cut_mode: cuts
    forbidden_effects: [soft_focus, halation]
    keyword_pool:
      - drift car night
      - anime style cityscape
      - japanese street tilted
      - headlight glare drift
      - speed motion blur
      - wheel smoke close
    phrase_pool:
      - the drift never ends
      - midnight runner
      - no rear view
      - tokyo expressway
      - speed limit zero
    notes: |
      Drift-phonk: RGB-split + speed-ramp + saturation pulse on the drop.

  hyperpop:
    aliases: [glitch, breakcore, gabber]
    phrase_beats: 2             # sub-beat
    grain_intensity: 0
    vignette_angle: off
    zoom_pulse_amp: 0.20       # strongest
    shader: strobe             # was: datamosh (unimpl) — strobe is the available chaos
    # beat_burst / shake also valid alternatives
    lut_direction: hyper_saturated
    cut_mode: cuts
    forbidden_effects: [restraint, halation, soft_focus]
    keyword_pool:
      - glitch screen close
      - rgb shift abstract
      - neon strobe rapid
      - pixel art motion
      - ai abstract face
      - cyber distortion
    phrase_pool:
      - scream into the cloud
      - everything everywhere
      - perfect glitch
      - future already
      - pure noise
    notes: |
      Hyperpop / glitch: datamosh + pixel-sort + RGB-split.  The visual IS
      the chaos. Restraint reads as wrong.

  # ───── Folk / acoustic family ─────

  cottagecore:
    aliases: [folk, acoustic_folk, indie_folk]
    phrase_beats: 16
    grain_intensity: 6
    vignette_angle: PI/5
    zoom_pulse_amp: 0
    shader: halation           # soft sun-flare alternative
    lut_direction: warm_green_gold
    cut_mode: cuts
    forbidden_effects: [scanline, neon_edge, datamosh, vhs]
    keyword_pool:
      - wildflower meadow
      - wooden cottage window
      - warm kitchen morning
      - knitted texture
      - forest dappled light
      - stream pebbles
    phrase_pool:
      - the meadow at noon
      - warm bread cooling
      - the fireplace still
      - afternoon rain
      - old books
    notes: |
      Warm grain + soft sun-flare + green/gold LUT.  No neon, no urban, no glitch.

  # ───── Classical family ─────

  classical:
    aliases: [orchestral, chamber, baroque]
    phrase_beats: 999           # no rhythmic cuts
    grain_intensity: 6
    vignette_angle: PI/5
    zoom_pulse_amp: 0
    shader: halation
    lut_direction: warm_classical
    cut_mode: stillzoom
    forbidden_effects: [scanline, neon_edge, datamosh, vhs, kaleidoscope]
    keyword_pool:
      - old painting close
      - leather book pages
      - marble statue detail
      - cathedral light beam
      - library candle close
      - violin scroll macro
    phrase_pool:
      - the cathedral light
      - her last letter
      - a slow goodbye
      - memory of summer
      - the violin alone
    notes: |
      Ken-Burns on still painting / album art.  Slow, contemplative.
      Any modern UI / digital effect reads as wrong.

  # ───── Liminal / dreamcore (slow, otherworldly) ─────

  dreamcore:
    aliases: [liminal, weirdcore]
    phrase_beats: 999
    grain_intensity: 4          # soft VHS-style grain
    vignette_angle: PI/4
    zoom_pulse_amp: 0
    shader: vhs
    lut_direction: pastel_sky
    cut_mode: stillzoom
    forbidden_effects: [scanline, datamosh, sharp_cuts]
    keyword_pool:
      - empty pool pastel
      - liminal hallway pink
      - abandoned playground
      - drained mall
      - endless staircase
      - soft fog corridor
    phrase_pool:
      - the empty pool
      - this hallway repeats
      - you have been here before
      - no one is following
      - soft static
    notes: |
      Pastel + soft VHS grain + slight blur.  Sharp hi-contrast breaks the mood.


# ───── Operator-facing genre selection guide ─────
#
# When in doubt, the "energy × texture" 2x2:
#
#               soft texture                hard texture
#               ─────────────────           ─────────────────
#   slow energy   ambient, classical,        (rare — try jazz)
#                 cottagecore, dreamcore
#
#   fast energy   lofi_hiphop, jazz          synthwave, house, techno,
#                                            phonk, hyperpop
