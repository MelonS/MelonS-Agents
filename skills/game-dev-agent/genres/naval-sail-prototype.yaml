# Genre template — 범선 시대(Age-of-Sail) 항해 무역 게임, 이동 프로토타입 (lite).
#
# Loaded by skills/game-dev-agent/scripts/modules/planner.py.
# Adding a new genre = adding a new file in this dir.  NO planner code change.
#
# 이 장르는 3D다 (colony-sim-lite 는 2D 스프라이트 — 다른 렌더링 파이프라인).
# `sprites` 필드엔 2D 스프라이트가 아니라 3D 모델/셰이더 에셋 슬러그를 담는다.
#
# 스코프: "재미있는 게임"이 아니라 "배가 3D 바다 위에서 뜨고 움직이는가"만 검증하는
# 이동감 프로토타입.  전투/무역/탐험/여러 척은 전부 스코프 밖 (v0 이후).
#
# 참고: doc/next-title-naval-prototype-2026-08-12.md — OpenMMO(Julian-adv, water
# system: Gerstner wave 3파 합성 + 하이트맵 기반 수심 샘플링)에서 파도 셰이더
# 접근을 참고했다. 부력(buoyancy)은 OpenMMO에도 없어서 직접 설계함.
#
# 2026-08-12 — PawnSim(colony-sim-lite)과 같은 Unity 프로젝트 안에서 시작했다가
# 별도 프로젝트로 분리했다. ProjectSettings(렌더 파이프라인·물리 등)를 공유하면
# NAN2026 심사 종료(9/6)까지 건드리면 안 되는 PawnSim 제출물에 영향을 줄 위험이
# 있었기 때문. games/pawnsim/ 은 심사 종료 후에 skills/game-prototype/ 에서
# 옮겨질 예정 — 그 전까진 이 장르만 games/ 패턴을 쓴다.

name: naval-sail-prototype
description: "범선 시대 항해 무역 시뮬레이션 이동 프로토타입. 3D 바다 위 배 1척, 카메라 2.5D/3D 전환."
project_path: games/naval-sail/unity-project

match_keywords:
  - naval
  - sailing
  - 항해
  - 범선
  - ship

vision:
  tone: "묵직한 배의 관성감 — 즉각 반응하지 않는 범선 특유의 느낌"
  core_loop: "(프로토타입 단계엔 루프 없음) 조작 → 배가 파도에 맞춰 뜨고 기운다 → 이동"
  feel: "가볍지 않다. 방향 전환·가감속에 관성이 붙는다"

team:
  - game-director
  - pm
  - programmer
  - artist        # placeholder 배/바다 비주얼만, 최종 아님
  - qa
  - build-engineer

sprites:
  - ship-pirate-medium.fbx   # Kenney Pirate Kit(CC0) — 박스 placeholder에서 교체 완료
  - ocean_plane_mesh         # 3D 평면 메시 + Gerstner wave 셰이더 (코드 생성, 에셋 아님)

scripts:
  - ShipController          # Rigidbody 이동 + 관성, 조타 입력
  - OceanWaveSampler         # Gerstner wave 높이를 CPU 코드로도 계산 (셰이더와 공유 파라미터)
  - ShipBuoyancy             # 배 바닥 4점 높이 샘플 → Y 위치 + 피치/롤
  - CameraRig2Point5D        # 고정 피치각 추적 카메라 (범선 항해 게임 특유의 시점)
  - CameraRig3D              # 배 뒤 자유 회전 추적 카메라
  - CameraModeSwitcher       # 두 리그 사이 보간 전환 (급전환 방지)
  - GameManager

scenes:
  - MainMenu
  - OceanPrototype

systems:
  - Gerstner wave 수면 셰이더 (3파 합성, Y축 변위만 — OpenMMO 파장값 20/14/9m 시작점)
  - CPU 높이 샘플링 기반 부력 (OpenMMO엔 없음 — 직접 구현)
  - 배 이동: 스로틀 전후진 + 방향타, 관성 있는 가감속
  - 카메라 2.5D↔3D 전환 (씬 하나, 카메라 리그 두 개 토글 + 보간)

audio: []   # 프로토타입 단계 — 스코프 밖

days_estimate: 5
