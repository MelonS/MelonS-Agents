# Example job-hunt filter — copy to filters.yaml and edit.
#
# This file ships in-repo as a documented starting point.  The real
# filters.yaml is operator-local and may or may not be committed
# depending on whether it contains personally identifying context.

# Required.  Currently only "kr" is implemented.  Other locales need
# a matching sources/<locale>-*.sh plugin to be added via PR.
# Note: `global-*` plugins (ATS / RemoteOK / Remotive / HN) are
# locale-agnostic and ship enabled alongside the kr stack — their
# data is global / remote / English-language regardless of this field.
locale: kr

# 직군 (job category).  String-match against posting category fields.
# Keep small — fewer categories = higher signal-to-noise.
job_categories:
  - 백엔드 개발자
  - AI 엔지니어
  - 풀스택 개발자

# 지역 (region).  Korean sido or sido + sigungu.  "원격" is a special
# value meaning "remote-friendly opt-in" — each source maps it to
# its own remote/재택 filter.
regions:
  - 서울
  - 경기 성남
  - 원격

# Keyword filter.  Applied to title + summary post-fetch.
keywords:
  include:           # at least one of these must appear in title or summary
    - Python
    - AI
    - LLM
    - agent
  exclude:           # any of these in title/summary drops the posting
    - SI
    - 파견
    - 단순 운영

# Source plugins to enable.  Each must have a matching file at
# skills/job-hunt/sources/<name>.sh implementing fetch_postings().
#
# Live-mode gating: every plugin defaults to MOCK-FALLBACK.  Set the
# corresponding env var (`JH_<NAME>_LIVE=1`) to switch to live HTTP.
# See `sources/<name>.sh` headers for per-plugin auth / quota
# expectations.
#
# Status legend:
#   ⭐ live-ready  — flip the env flag and it just works (no key)
#   🔑 needs key   — operator obtains API key first, then flips flag
#   ⚠️  scaffolded — live path coded but not operator-validated
#   ⛔ permanent mock — see plugin header for why
sources:
  - global-ats           # ⭐ Greenhouse + Ashby + Lever public boards
  - global-remoteok      # ⭐ remoteok.com/api
  - global-remotive      # ⭐ remotive.com/api/remote-jobs
  - global-hn-whoshiring # ⭐ HN monthly "Who is hiring?" thread
  - kr-worknet           # ⭐ 워크넷 (정부 공공고용서비스 SSR)
  - kr-theteams          # ⭐ 더팀스 (KR 스타트업 / 강소기업; sitemap)
  - kr-wanted            # 🔑 Wanted partner API (WANTED_API_KEY)
  - kr-saramin           # 🔑 Saramin OpenAPI (SARAMIN_KEY)
  - kr-jobkorea          # ⛔ permanent mock — robots.txt + 2017 precedent
  - kr-programmers       # ⛔ service closed 2025-05-19 — deprecated stub
  # - _mock           # synthetic test fixture; uncomment when
  #                   # validating pipeline changes without burning
  #                   # real fetches.

# Output settings.
output:
  records_root: ./records/jobs
  format: markdown   # md | json
